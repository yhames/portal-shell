metadata:
  # 서비스 소유 팀 또는 조직을 구분하는 네임스페이스
  namespace: robotics
  # 네임스페이스 내에서 이 서비스를 식별하는 이름 (kebab-case 권장)
  name: mission-management
  # 등록된 서비스의 Semantic Version
  version: 5.1.6

spec:
  # 서비스의 역할과 목적에 대한 상세 설명
  description: A service to manage missions for robots, including scheduling and monitoring.

  # 포털 UI 표시 설정
  display:
    # 포털 UI 메뉴 및 화면 상단에 표시될 서비스 명칭
    name: 미션 관리
    # 서비스 명칭 왼쪽에 표시될 아이콘 식별자
    icon: file-lines
    # 포털 UI에서 이 서비스가 노출될 정렬 순서
    order: 10

  # 프론트엔드 UI 통합 방식 및 주소 설정
  frontend:
    # 메인 포털에 UI를 임베드하는 방식 (ex. iframe, mfe 등)
    type: iframe
    # 프론트엔드 웹 애플리케이션이 구동 중인 실제 URL
    url: http://localhost:3001

  # 백엔드 API 서버 연동 및 헬스체크 설정
  backend:
    # 포털이 서비스 상태를 확인하기 위한 헬스체크 엔드포인트
    healthUrl: http://localhost:8001/health
